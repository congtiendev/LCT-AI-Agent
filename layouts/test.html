<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Preview</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
      }

      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 30px;
      }

      .video-container {
        position: relative;
        width: 100%;
        height: 600px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      .video-frame {
        width: 100%;
        height: 100%;
        border: none;
      }

      .loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #666;
        font-size: 18px;
      }

      @media (max-width: 768px) {
        .video-container {
          height: 400px;
        }

        body {
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Video Preview</h1>

      <div class="video-container">
        <div class="loading">Đang tải video...</div>
        <iframe
          class="video-frame"
          src="https://drive.google.com/file/d/1pomXU1x2fTSeneNlDK3WPwHCEHr7Xf9s/preview"
          allowfullscreen
        >
        </iframe>
      </div>
    </div>

    <script>
      // Ẩn loading text khi iframe load xong
      const iframe = document.querySelector('.video-frame')
      const loading = document.querySelector('.loading')

      iframe.onload = function () {
        loading.style.display = 'none'
      }
    </script>
  </body>
</html>
